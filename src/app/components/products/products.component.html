<div class="card p-4 m-4 shadow-1">
    <div class="flex align-items-center justify-content-between mb-4">
        <h2 class="m-0 text-3xl font-bold">Catálogo de Productos</h2>
        <p-button label="Nueva Venta" icon="pi pi-plus" routerLink="/ventas/nueva" styleClass="p-button-primary"></p-button>
    </div>

    <p-table 
        #dt 
        [value]="products" 
        [paginator]="true" 
        [rows]="10" 
        [loading]="loading"
        [globalFilterFields]="['name']"
        [rowHover]="true"
        styleClass="p-datatable-striped"
        [tableStyle]="{ 'min-width': '50rem' }"
    >
        <ng-template pTemplate="caption">
            <div class="flex justify-content-end">
                <span class="p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar por nombre..." />
                </span>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
                <th>Imagen</th>
                <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="price">Precio <p-sortIcon field="price"></p-sortIcon></th>
                <th pSortableColumn="stock">Stock <p-sortIcon field="stock"></p-sortIcon></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
            <tr>
                <td><span class="font-bold text-500">{{ product.id }}</span></td>
                <td>
                    <img *ngIf="product.image" [src]="product.image" [alt]="product.name" width="50" class="shadow-2 border-round" />
                    <i *ngIf="!product.image" class="pi pi-image text-3xl text-300"></i>
                </td>
                <td class="font-semibold">{{ product.name }}</td>
                <td class="font-bold text-primary">Bs. {{ product.price | number:'1.2-2' }}</td>
                <td>
                    <p-tag 
                        [value]="product.stock > 0 ? product.stock + ' en stock' : 'Agotado'" 
                        [severity]="product.stock > 0 ? 'success' : 'danger'"
                        [icon]="product.stock > 0 ? 'pi pi-check' : 'pi pi-times'"
                    ></p-tag>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-5 text-500 font-semibold">
                    No se encontraron productos.
                </td>
            </tr>
        </ng-template>
    </p-table>

    <div *ngIf="error && !loading" class="mt-4">
        <p-message severity="error" [text]="error" styleClass="w-full"></p-message>
    </div>
</div>
