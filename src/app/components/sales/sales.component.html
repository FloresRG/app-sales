<p-confirmDialog [style]="{ width: '420px' }"></p-confirmDialog>

<div class="card p-4 m-4 shadow-1">
    <div class="flex align-items-center justify-content-between mb-4">
        <h2 class="m-0 text-3xl font-bold">Registro de Ventas</h2>
        <p-button label="Nueva Venta" icon="pi pi-plus" routerLink="/ventas/nueva" styleClass="p-button-primary"></p-button>
    </div>

    <p-table 
        [value]="sales" 
        dataKey="id" 
        [paginator]="true" 
        [rows]="10" 
        [loading]="loading"
        styleClass="p-datatable-striped"
        [tableStyle]="{ 'min-width': '60rem' }"
    >
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 5rem"></th>
                <th pSortableColumn="id"># ID <p-sortIcon field="id"></p-sortIcon></th>
                <th pSortableColumn="created_at">Fecha <p-sortIcon field="created_at"></p-sortIcon></th>
                <th pSortableColumn="total">Total <p-sortIcon field="total"></p-sortIcon></th>
                <th class="text-center">Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-sale let-expanded="expanded">
            <tr>
                <td>
                    <button type="button" pButton pRipple [pRowToggler]="sale" class="p-button-text p-button-rounded p-button-plain" [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></button>
                </td>
                <td class="font-bold text-500">{{ sale.id }}</td>
                <td>{{ sale.created_at }}</td>
                <td class="font-bold text-primary">Bs. {{ sale.total | number:'1.2-2' }}</td>
                <td class="text-center flex justify-content-center gap-2">
                    <p-button 
                        icon="pi pi-print" 
                        styleClass="p-button-secondary p-button-text p-button-rounded" 
                        (onClick)="printReceipt(sale)"
                        pTooltip="Imprimir Nota"
                        tooltipPosition="bottom"
                    ></p-button>
                    <p-button 
                        icon="pi pi-trash" 
                        styleClass="p-button-danger p-button-text p-button-rounded" 
                        (onClick)="deleteSale(sale.id)"
                        [loading]="deletingId === sale.id"
                        pTooltip="Eliminar venta"
                        tooltipPosition="bottom"
                    ></p-button>
                </td>
            </tr>
        </ng-template>
        
        <!-- ROW EXPANSION: Detalles de la Venta -->
        <ng-template pTemplate="rowexpansion" let-sale>
            <tr>
                <td colspan="5">
                    <div class="p-3 surface-100 border-round">
                        <h5 class="mb-3 mt-0 text-700"><i class="pi pi-list mr-2"></i>Detalle de Productos Vendidos</h5>
                        <p-table [value]="sale.details" [tableStyle]="{ 'min-width': '40rem' }" styleClass="p-datatable-sm">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-detail>
                                <tr>
                                    <td class="font-semibold">{{ detail.product }}</td>
                                    <td>{{ detail.quantity }}</td>
                                    <td class="font-bold text-secondary">Bs. {{ detail.subtotal | number:'1.2-2' }}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-5 text-500 font-semibold">
                    No hay ventas registradas aún.
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
